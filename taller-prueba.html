<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Taller de Alianza Heroica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1020;--panel:#161b33;--panel2:#1e2545;--line:#2c3561;--txt:#f2f4ff;--mut:#a9b0d6;--y:#ffd23f;--b:#4db8ff;--r:#ff5a5f;--p:#a78bfa;--g:#34d399}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-size:16px}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a2f6a55,transparent),var(--bg);min-height:100vh}
h1,h2,h3{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-weight:400;margin:0}
button{font-family:inherit;font-size:15px;font-weight:800;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt);background:#0f1430;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--y)}
textarea{min-height:84px;resize:vertical;line-height:1.35}
label.lb{display:block;font-weight:900;font-size:14px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 80px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:40px;color:var(--y);text-shadow:0 3px 0 #7a1f8a}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 18px}
.tab.on{background:var(--y);color:#141414;border-color:var(--y)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.who input{width:130px;padding:8px 10px}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--panel2);border:2px solid var(--line)}
.btn.pri{background:var(--y);color:#141414;border-color:var(--y)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.del{background:#3a1520;border-color:#6a2232;color:#ffb3bd}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:250px}
.card:hover{border-color:var(--y)}
.card .av{height:150px;border-radius:12px;background:#0f1430;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.card .av img{width:100%;height:100%;object-fit:cover}
.card b{font-family:Bangers;font-size:24px;letter-spacing:1px;font-weight:400}
.badge{display:inline-block;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;background:#0f1430;border:1px solid var(--line)}
.st-idea{background:#3b3413;border-color:#7a6a1e;color:#ffe58a}.st-dis{background:#13283b;border-color:#1e5a7a;color:#9fdcff}.st-listo{background:#133b26;border-color:#1e7a4a;color:#8fffc0}.st-juego{background:#2a1a40;border-color:#5a3a8a;color:#d6c2ff}
.new{border-style:dashed;align-items:center;justify-content:center;font-family:Bangers;font-size:26px;color:var(--y)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.ed{grid-template-columns:1fr}.side{position:static!important}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.step{white-space:nowrap;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:14px}
.step.on{border-color:var(--y);color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#0f1430;border-radius:999px;padding:9px 14px;font-size:15px}
.chip.on{background:var(--y);color:#141414;border-color:var(--y)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.vc{border:2px solid var(--line);background:#0f1430;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;min-height:112px;justify-content:center}
.vc svg{width:58px;height:58px}
.vc.on{border-color:var(--y);background:#2a2610;color:var(--y)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid #0000}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--y)}
.slab{display:flex;justify-content:space-between;font-weight:800}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--y);height:34px}
.stat{display:grid;grid-template-columns:110px 44px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.stat .pips{display:flex;gap:4px}.stat .pips i{flex:1;height:14px;border-radius:4px;background:#2c3561}.stat .pips i.on{background:var(--y)}
.pw{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.pw h3{font-size:24px}
.shape{width:70px;height:56px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ref{background:#0f1430;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.ref img{width:100%;height:130px;object-fit:cover;display:block}
.ref textarea{border:0;border-radius:0;min-height:50px;font-size:14px}
.cm{background:#0f1430;border-radius:12px;padding:10px 12px;margin:8px 0}
.cm small{color:var(--mut);font-weight:800}
.save{font-size:13px;color:var(--mut);font-weight:800}
.stage{background:var(--panel2);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.esc{min-height:84px;border-radius:14px;border:3px solid transparent;color:#fff;font-family:Bangers;font-size:20px;letter-spacing:1px;display:flex;align-items:flex-end;padding:8px;text-shadow:0 2px 0 #000}
.esc.on{border-color:var(--y);box-shadow:0 0 0 2px #000 inset}
.foe{display:flex;align-items:center;gap:8px;background:#0f1430;border:2px solid var(--line);border-radius:12px;padding:6px 8px}
.foe input{width:64px;padding:6px}
.empty{padding:30px;text-align:center;color:var(--mut)}
.note{background:#1d2a1d;border:2px solid #2f5a2f;color:#c8ffc8;border-radius:14px;padding:10px 14px;font-size:14px}
.warn{background:#3a2a13;border:2px solid #7a5a1e;color:#ffe2a8;border-radius:14px;padding:10px 14px;font-size:14px}
</style>
</head>

function fill(base,o){if(!o||typeof o!=='object')return base;for(const k in base){if(!(k in o))continue;const b=base[k],v=o[k];
  if(b&&typeof b==='object'&&!Array.isArray(b))base[k]=fill(b,v);else if(Array.isArray(b))base[k]=Array.isArray(v)?clone(v):b;else if(typeof v===typeof b||b==='')base[k]=v;}
  for(const k in o)if(!(k in base))base[k]=clone(o[k]);return base;}

/* ===================== siluetas ===================== */
function silhouette(c,cx,gy,ppm,opt={}){
  const cu=c.cuerpo||{},H=num(cu.altura,0.3,6,1.7)*ppm,w=(COMPLEX.find(x=>x.v===cu.complexion)||COMPLEX[1]).w;
  const big=cu.proporcion==='caricatura',sp=cu.especie||'humano',ex=cu.extras||[];
  const col=opt.gray?'#59607f':safeCol((c.apariencia||{}).colores?.[0]),col2=opt.gray?'#454b68':safeCol((c.apariencia||{}).colores?.[1]);
  const top=gy-H,out=[];let hr=big?H*0.15:H*0.07;if(sp==='alien')hr=H*0.12;
  const headY=top+hr,neck=top+hr*2,legS=neck+(gy-neck)*(big?0.48:0.42),tw=(big?(gy-neck)*0.5:H*0.2)*w,lw=tw*0.4,aw=tw*0.26,rx=sp==='robot'?2:Math.min(tw*0.3,14);
  if(ex.includes('Aura brillante'))out.push(`<ellipse cx="${cx}" cy="${gy-H/2}" rx="${tw*1.6}" ry="${H*0.62}" fill="${col}" opacity=".18"/>`);
  if(ex.includes('Alas'))out.push(`<path d="M${cx-tw*0.3} ${neck+tw*0.3}C${cx-tw*2.2} ${neck-H*0.15} ${cx-tw*2.6} ${neck+H*0.25} ${cx-tw*0.5} ${legS-H*0.05}Z M${cx+tw*0.3} ${neck+tw*0.3}C${cx+tw*2.2} ${neck-H*0.15} ${cx+tw*2.6} ${neck+H*0.25} ${cx+tw*0.5} ${legS-H*0.05}Z" fill="${col2}" opacity=".85"/>`);
  if(ex.includes('Capa'))out.push(`<path d="M${cx-tw*0.45} ${neck}L${cx+tw*0.45} ${neck}L${cx+tw*0.9} ${gy-H*0.08}L${cx-tw*0.9} ${gy-H*0.08}Z" fill="${col2}" opacity=".9"/>`);
  if(ex.includes('Cola'))out.push(`<path d="M${cx} ${legS}C${cx+tw*1.4} ${legS+H*0.1} ${cx+tw*1.8} ${legS-H*0.15} ${cx+tw*1.6} ${legS-H*0.25}" stroke="${col}" stroke-width="${Math.max(3,tw*0.18)}" fill="none" stroke-linecap="round"/>`);
  if(sp==='elemental'){out.push(`<path d="M${cx} ${top}C${cx+tw*0.6} ${top+H*0.25} ${cx+tw*1.1} ${top+H*0.45} ${cx+tw*0.9} ${gy-H*0.25}C${cx+tw*0.8} ${gy} ${cx-tw*0.8} ${gy} ${cx-tw*0.9} ${gy-H*0.25}C${cx-tw*1.1} ${top+H*0.5} ${cx-tw*0.2} ${top+H*0.35} ${cx} ${top}Z" fill="${col}"/><path d="M${cx} ${top+H*0.35}C${cx+tw*0.4} ${top+H*0.55} ${cx+tw*0.5} ${gy-H*0.2} ${cx} ${gy-H*0.08}C${cx-tw*0.5} ${gy-H*0.2} ${cx-tw*0.3} ${top+H*0.5} ${cx} ${top+H*0.35}Z" fill="${col2}" opacity=".8"/>`);return out.join('');}
  if(sp==='criatura'){out.push(`<path d="M${cx-tw*1.1} ${gy}C${cx-tw*1.2} ${top+H*0.35} ${cx-tw*0.5} ${top+H*0.08} ${cx} ${top+H*0.08}C${cx+tw*0.5} ${top+H*0.08} ${cx+tw*1.2} ${top+H*0.35} ${cx+tw*1.1} ${gy}Z" fill="${col}"/><circle cx="${cx-tw*0.3}" cy="${top+H*0.3}" r="${Math.max(2,tw*0.1)}" fill="#fff"/><circle cx="${cx+tw*0.3}" cy="${top+H*0.3}" r="${Math.max(2,tw*0.1)}" fill="#fff"/>`);
    if(ex.includes('Cuernos'))out.push(`<path d="M${cx-tw*0.5} ${top+H*0.14}l${-tw*0.25} ${-H*0.14} ${tw*0.45} ${H*0.1}Z M${cx+tw*0.5} ${top+H*0.14}l${tw*0.25} ${-H*0.14} ${-tw*0.45} ${H*0.1}Z" fill="${col2}"/>`);return out.join('');}
  // brazos
  const armY=neck+tw*0.15,armL=(legS-neck)*1.05,ang=18;
  const arm=(sx,dy=0)=>`<rect x="${cx+sx*(tw/2)-aw/2}" y="${armY+dy}" width="${aw}" height="${armL}" rx="${Math.min(aw/2,8)}" fill="${col}" transform="rotate(${-sx*ang} ${cx+sx*(tw/2)} ${armY+dy})"/>`;
  out.push(arm(-1),arm(1));if(ex.includes('4 brazos'))out.push(arm(-1,armL*0.35),arm(1,armL*0.35));
  // piernas
  out.push(`<rect x="${cx-tw*0.06-lw}" y="${legS-4}" width="${lw}" height="${gy-legS+4}" rx="${Math.min(lw/2,8)}" fill="${col2}"/><rect x="${cx+tw*0.06}" y="${legS-4}" width="${lw}" height="${gy-legS+4}" rx="${Math.min(lw/2,8)}" fill="${col2}"/>`);
  // torso
  out.push(`<rect x="${cx-tw/2}" y="${neck}" width="${tw}" height="${legS-neck+2}" rx="${rx}" fill="${col}"/>`);
  // cabeza
  if(sp==='robot')out.push(`<rect x="${cx-hr*1.05}" y="${top}" width="${hr*2.1}" height="${hr*2}" rx="2" fill="${col}"/><line x1="${cx}" y1="${top}" x2="${cx}" y2="${top-hr*0.6}" stroke="${col}" stroke-width="2"/><rect x="${cx-hr*0.7}" y="${top+hr*0.7}" width="${hr*1.4}" height="${hr*0.4}" fill="${col2}"/>`);
  else if(sp==='alien')out.push(`<ellipse cx="${cx}" cy="${headY}" rx="${hr*0.9}" ry="${hr*1.1}" fill="${col}"/>`);
  else out.push(`<circle cx="${cx}" cy="${headY}" r="${hr}" fill="${col}"/>`);
  if(sp==='animal'||ex.includes('Orejas de animal'))out.push(`<path d="M${cx-hr*0.8} ${headY-hr*0.4}l${-hr*0.2} ${-hr*1} ${hr*0.8} ${hr*0.6}Z M${cx+hr*0.8} ${headY-hr*0.4}l${hr*0.2} ${-hr*1} ${-hr*0.8} ${hr*0.6}Z" fill="${col}"/>`);
  if(ex.includes('Cuernos'))out.push(`<path d="M${cx-hr*0.5} ${headY-hr*0.7}l${-hr*0.3} ${-hr*0.9} ${hr*0.6} ${hr*0.6}Z M${cx+hr*0.5} ${headY-hr*0.7}l${hr*0.3} ${-hr*0.9} ${-hr*0.6} ${hr*0.6}Z" fill="${col2}"/>`);
  if(ex.includes('Antenas'))out.push(`<path d="M${cx-hr*0.3} ${top}l${-hr*0.4} ${-hr*0.9}M${cx+hr*0.3} ${top}l${hr*0.4} ${-hr*0.9}" stroke="${col}" stroke-width="2"/>`);
  if(!opt.gray)out.push(`<circle cx="${cx-hr*0.35}" cy="${headY-hr*0.05}" r="${Math.max(1.2,hr*0.12)}" fill="#fff"/><circle cx="${cx+hr*0.35}" cy="${headY-hr*0.05}" r="${Math.max(1.2,hr*0.12)}" fill="#fff"/>`);
  return out.join('');}
function heightScene(c){const W=460,Hh=280,gy=262,maxH=Math.max(2.2,num(c.cuerpo.altura,0.3,6,1.7)+0.4),ppm=(gy-24)/maxH;
  const g=[`<rect x="0" y="${gy}" width="${W}" height="${Hh-gy}" fill="#2c3561"/>`];
  for(let m=1;m<=Math.floor(maxH);m++){const y=gy-m*ppm;g.push(`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#2c3561" stroke-dasharray="4 6"/><text x="6" y="${y-4}" fill="#a9b0d6" font-size="12" font-weight="800">${m} m</text>`);}
  const adult={cuerpo:{altura:1.75,complexion:'atletico',especie:'humano'}},kid={cuerpo:{altura:1.4,complexion:'delgado',especie:'humano'}};
  g.push(silhouette(adult,110,gy,ppm,{gray:true}),silhouette(kid,170,gy,ppm,{gray:true}));
  g.push(`<text x="110" y="${gy+15}" fill="#a9b0d6" font-size="11" text-anchor="middle" font-weight="800">Adulto 1.75</text><text x="170" y="${gy+15}" fill="#a9b0d6" font-size="11" text-anchor="middle" font-weight="800">Niño 1.40</text>`);
  g.push(silhouette(c,320,gy,ppm));g.push(`<text x="320" y="${gy+15}" fill="#ffd23f" font-size="12" text-anchor="middle" font-weight="900">${(c.nombre||'Tu personaje').replace(/[<>&"]/g,'')} ${num(c.cuerpo.altura,0.3,6,1.7).toFixed(2)} m</text>`);
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto;background:#0f1430;border-radius:16px" role="img" aria-label="Comparación de altura">${g.join('')}</svg>`;}
function miniAvatar(c){const ppm=128/Math.max(1.25,num(c.cuerpo?.altura,0.3,6,1.7)+0.08);return `<svg viewBox="0 0 120 150" width="100%" height="150" aria-hidden="true">${silhouette(fill(newChar(),c),60,142,ppm)}</svg>`;}
function radar(stats){const R=70,cx=95,cy=88,n=STATS.length;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5];};
  let g='';for(const L of [1,2,3,4,5])g+=`<polygon points="${STATS.map((_,i)=>pt(i,L).join(',')).join(' ')}" fill="none" stroke="#2c3561"/>`;
  g+=`<polygon points="${STATS.map(([k],i)=>pt(i,num(stats[k],1,5,1)).join(',')).join(' ')}" fill="#ff5a5f55" stroke="#ff5a5f" stroke-width="2"/>`;
  STATS.forEach(([k,l],i)=>{const [x,y]=pt(i,6.3);g+=`<text x="${x}" y="${y}" fill="#a9b0d6" font-size="11" font-weight="800" text-anchor="middle">${l}</text>`;});
  return `<svg viewBox="-22 0 234 182" style="width:100%;max-width:300px" role="img" aria-label="Gráfica de estadísticas">${g}</svg>`;}

function chips(opts,val,onCh,multi){const box=el('div',{class:'chips'});const draw=()=>{box.replaceChildren(...opts.map(o=>{const v=o.v??o,l=o.l??o;const on=multi?val().includes(v):val()===v;
  return el('button',{type:'button',class:'chip'+(on?' on':''),'aria-pressed':String(on),onclick:()=>{if(multi){const a=val().slice();const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);onCh(a);}else onCh(on?'':v);draw();}},l);}));};draw();return box;}
function vcards(opts,val,onCh){const box=el('div',{class:'cards'});const draw=()=>{box.replaceChildren(...opts.map(o=>{const on=val()===o.v;
  return el('button',{type:'button',class:'vc'+(on?' on':''),'aria-pressed':String(on),onclick:()=>{onCh(o.v);draw();}},el('span',{svg:o.i||''}),o.l,o.d?el('small',{style:'color:#a9b0d6;font-size:12px'},o.d):null);}));};draw();return box;}

/* ===================== estado / datos ===================== */
const ST={view:'galeria',filtro:'todos',pjs:new Map(),hist:new Map(),cur:null,curKind:null,step:0,db:null,assets:null,canWrite:true,unsubC:null,comments:[]};
let saveTimer=null,saving=false,pendingSave=false;
function setMsg(html,cls){const m=$('#msg');m.replaceChildren();if(html)m.append(el('div',{class:cls||'note',style:'margin-bottom:12px'},html));}
function markDirty(){if(!ST.cur)return;ST.cur.data.actualizado=Date.now();ST.cur.data.por=who();const s=$('#savest');if(s)s.textContent='Guardando…';clearTimeout(saveTimer);saveTimer=setTimeout(doSave,900);refreshSide();}
async function doSave(){if(!ST.cur||!ST.db)return;if(saving){pendingSave=true;return;}saving=true;const {kind,id,data}=ST.cur;
  try{await ST.db.doc((kind==='pj'?'personajes/':'historias/')+id).set(clone(data));const s=$('#savest');if(s)s.textContent='Guardado ✓';}
  catch(e){const s=$('#savest');if(s)s.textContent='No se pudo guardar';if(e&&e.code==='invalid_argument'){ST.canWrite=false;setMsg('Tu cuenta solo puede ver el taller, no editarlo.','warn');}else if(e&&e.code==='quota_exceeded')setMsg('El taller se llenó: borra personajes o imágenes que ya no uses.','warn');}
  saving=false;if(pendingSave){pendingSave=false;doSave();}}

/* ===================== navegación ===================== */
function tabs(){const t=[['galeria','Personajes'],['historias','Historias']];$('#tabs').replaceChildren(...t.map(([v,l])=>el('button',{class:'tab'+((ST.view===v||(v==='galeria'&&ST.view==='pj')||(v==='historias'&&ST.view==='hist'))?' on':''),onclick:()=>go(v)},l)));}
function go(v,id){if(ST.unsubC){ST.unsubC();ST.unsubC=null;}ST.comments=[];if(ST.cur&&saveTimer){clearTimeout(saveTimer);doSave();}
  ST.view=v;ST.step=0;ST.cur=null;
  if(v==='pj'||v==='hist'){const map=v==='pj'?ST.pjs:ST.hist;const base=v==='pj'?newChar():newStory();ST.cur={kind:v,id,data:fill(base,map.get(id)||{})};subscribeComments();}
  render();window.scrollTo(0,0);}
function subscribeComments(){if(!ST.db||!ST.cur)return;const path=(ST.cur.kind==='pj'?'personajes/':'historias/')+ST.cur.id+'/comentarios';
  try{ST.unsubC=ST.db.collection(path).orderBy('fecha').onSnapshot(s=>{ST.comments=s.docs.map(d=>({id:d.id,...d.data()}));const b=$('#cmlist');if(b)drawComments(b);},()=>{});}catch(e){}}
function render(){tabs();const app=$('#app');app.replaceChildren();
  if(ST.view==='galeria')app.append(galeria());else if(ST.view==='historias')app.append(listaHistorias());else if(ST.view==='pj')app.append(editorPJ());else if(ST.view==='hist')app.append(editorHist());}

  const list=[...ST.pjs.entries()].map(([id,d])=>({id,d})).filter(x=>ST.filtro==='todos'||x.d.tipo===ST.filtro).sort((a,b)=>({heroe:0,jefe:1,enemigo:2}[a.d.tipo]??3)-({heroe:0,jefe:1,enemigo:2}[b.d.tipo]??3)||(a.d.creado||0)-(b.d.creado||0));
  const create=async tipo=>{const id=uid();const d=newChar(tipo);d.por=who();ST.pjs.set(id,d);go('pj',id);markDirty();};
  return el('div',{},
    el('div',{class:'filters'},fs.map(([v,l])=>el('button',{class:'chip'+(ST.filtro===v?' on':''),onclick:()=>{ST.filtro=v;render();}},l))),
    el('div',{class:'grid'},
      ST.canWrite?el('button',{class:'card new',onclick:()=>create(ST.filtro==='todos'?'heroe':ST.filtro)},'+ Nuevo personaje'):null,
      list.map(({id,d})=>{const img=(d.refs||[]).find(r=>r.url);const e=estOf(d.estado);
        return el('button',{class:'card',onclick:()=>go('pj',id)},el('div',{class:'av',svg:img?'':miniAvatar(d)},img?el('img',{src:img.url,alt:''}):null),
          el('div',{class:'row',style:'gap:6px'},el('span',{class:'badge'},(TIPOS.find(t=>t.v===d.tipo)||TIPOS[0]).l),el('span',{class:'badge '+e.c},e.l)),

  return el('div',{class:'stage'},
    el('div',{class:'row',style:'justify-content:space-between'},el('h3',{style:'font-size:24px'},'Etapa '+(i+1)+(s.nombre?': '+s.nombre:'')),
      el('div',{class:'row'},i>0?el('button',{class:'btn sm',onclick:()=>{[d.etapas[i-1],d.etapas[i]]=[d.etapas[i],d.etapas[i-1]];redraw();ch();}},'↑'):null,el('button',{class:'btn sm del',onclick:()=>{if(confirmDel('esta etapa')){d.etapas.splice(i,1);redraw();ch();}}},'Quitar'))),
    ...lab('Nombre'),txt(s.nombre,v=>{s.nombre=v;ch();},'Ej. Plaza central'),
    ...lab('Escenario'),(()=>{const b=el('div',{class:'cards'});const dr=()=>b.replaceChildren(...ESCENARIOS.map(e=>el('button',{type:'button',class:'esc'+(s.escenario===e.v?' on':''),style:'background:'+e.g,'aria-pressed':String(s.escenario===e.v),onclick:()=>{s.escenario=e.v;dr();ch();}},e.l)));dr();return b;})(),
    ...lab('Objetivo'),chips(OBJETIVOS,()=>s.objetivo,v=>{s.objetivo=v;ch();}),
    rng('Oleadas de enemigos',1,6,1,()=>s.oleadas,v=>v+' oleadas',v=>{s.oleadas=v;ch();}),
    ...lab('Enemigos y cantidad'),foes,
    ...lab('Jefe'),chips(pjOpts(o=>o.tipo==='jefe'),()=>s.jefe,v=>{s.jefe=v;ch();refreshSide();}),
    ...lab('Cómo pelea el jefe','Fases, poderes, qué hacer para vencerlo'),txt(s.jefeFases,v=>{s.jefeFases=v;ch();},'Ej. Fase 1 golpea el piso. Fase 2 llama refuerzos…',true),
    ...lab('Escena','Lo que se cuenta al empezar la etapa'),txt(s.escena,v=>{s.escena=v;ch();},'',true),
    ...lab('Recompensa'),txt(s.recompensa,v=>{s.recompensa=v;ch();},'Ej. se desbloquea un héroe nuevo'));}
function hResumen(d,ch){return [el('h2',{style:'font-size:30px'},'Resumen'),
  el('div',{class:'pw'},el('b',{style:'font-family:Bangers;font-size:28px;color:var(--y)'},d.titulo||'Sin título'),el('p',{},d.resumen||''),
    el('ol',{},d.etapas.map(s=>el('li',{},`${s.nombre||'Etapa'} · ${(ESCENARIOS.find(e=>e.v===s.escenario)||{}).l||''} · ${s.oleadas} oleadas`+(s.jefe?' · Jefe: '+((ST.pjs.get(s.jefe)||{}).nombre||''):''))))),
  ...lab('Notas para Claude'),txt(d.notas,v=>{d.notas=v;ch();},'',true),
  ...lab('Estado'),chips(ESTADOS,()=>d.estado,v=>{d.estado=v||'idea';ch();render();}),
  el('div',{class:'hint',style:'margin-top:8px'},'Cuando esté lista, díganle a Claude: "lee la historia '+(d.titulo||'')+' en el taller".'),
  ST.canWrite?el('button',{class:'btn del',style:'margin-top:24px',onclick:async()=>{if(!confirmDel(d.titulo||'esta historia'))return;clearTimeout(saveTimer);const id=ST.cur.id;ST.cur=null;ST.hist.delete(id);try{await ST.db.doc('historias/'+id).delete();}catch(e){}go('historias');}},'Borrar historia'):null];}

/* ===================== arranque ===================== */
render();
(async()=>{
  const timer=setTimeout(()=>setMsg('No se pudo conectar con el taller todavía. Revisa tu internet; se cargará solo cuando haya conexión.','warn'),10000);
  for(let i=0;i<50&&!window.claude;i++)await new Promise(r=>setTimeout(r,100));
  const db=window.claude?await window.claude.use('db'):null;
  if(!db){clearTimeout(timer);setMsg('Para usar el taller tienes que abrirlo con la sesión de Claude iniciada.','warn');$('#app').replaceChildren(el('div',{class:'empty'},'Sin conexión al taller.'));return;}
  ST.db=db;try{ST.assets=await window.claude.use('assets');}catch(e){ST.assets=null;}
  try{const user=await window.claude.use('user');if(user&&user.can){const w=await user.can('data.write');if(w===false)ST.canWrite=false;}}catch(e){}
  const onList=(map,view)=>s=>{clearTimeout(timer);if(!s.metadata.fromCache)setMsg('');const keep=new Set();
    for(const d of s.docs){keep.add(d.id);if(ST.cur&&ST.cur.id===d.id&&saveTimer)continue;map.set(d.id,d.data());}
    for(const k of [...map.keys()])if(!keep.has(k)&&!(ST.cur&&ST.cur.id===k))map.delete(k);
    if(ST.view===view)render();};
  db.collection('personajes').onSnapshot(onList(ST.pjs,'galeria'),e=>{clearTimeout(timer);setMsg('No se pudieron cargar los personajes.','warn');});
  db.collection('historias').onSnapshot(onList(ST.hist,'historias'),e=>{});
})();
</script>
